# Builds and tests of pg_pmu: the suites on PostgreSQL 19 and master,
# at the revisions of postgres.env, on Linux on x86-64 and on AArch64
# and on macOS on Apple silicon; the checks of the crate; its models of
# loom; its proofs of Kani. The runners of Linux count, on AArch64 and
# on x86-64, the latter with a virtual PMU: there the suites must match
# their first expected outputs, and the suites of a kernel that refuses
# and of workers that cannot count run too, so that a runner that stops
# counting fails the job. The macOS runners are virtual machines that
# report no instructions and match the second expected outputs. The
# step "Expected outputs" says which output matched.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL ${{ matrix.postgres }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
        postgres: ['19', MASTER]
    runs-on: ${{ matrix.os }}
    env:
      # The locale of the temporary servers of the suites.
      LANG: C.UTF-8
      COUNTS: ${{ startsWith(matrix.os, 'ubuntu') }}
    steps:
      - uses: actions/checkout@v4
      - name: Revision
        id: revision
        run: |
          . .github/postgres.env
          eval "echo revision=\$POSTGRES_${{ matrix.postgres }}" >> "$GITHUB_OUTPUT"
          echo "PG_CONFIG=$HOME/postgres/bin/pg_config" >> "$GITHUB_ENV"
      - name: Build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex zlib1g-dev
      - uses: actions/cache@v4
        id: postgres
        with:
          path: ~/postgres
          key: postgres-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.revision }}-${{ hashFiles('.github/scripts/build-postgres.sh') }}
      - name: Build PostgreSQL
        if: steps.postgres.outputs.cache-hit != 'true'
        run: .github/scripts/build-postgres.sh ${{ steps.revision.outputs.revision }} "$HOME/postgres"
      # The module counts only where the kernel lets a process without
      # privileges count itself.
      - name: Allow counting (Linux)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.perf_event_paranoid=2
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pg_pmu_core -> target
      - name: Checks of the crate
        run: |
          if [ "$COUNTS" = true ]; then export PG_PMU_REQUIRE_COUNTERS=1; fi
          make check-crate
      - name: Build and install
        run: |
          make COPT=-Werror
          make install
      - name: Suites
        run: |
          if [ "$COUNTS" = true ]; then target=installcheck-counted; else target=installcheck; fi
          make $target EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster"
      - name: Expected outputs
        if: always()
        run: .github/scripts/expected-outputs.sh
      # The runners of macOS are virtual machines, which report no
      # instructions for a process.
      - name: Suite of a virtual machine (macOS)
        if: runner.os == 'macOS'
        run: make installcheck-vm EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster-vm"
      # At 4 an Ubuntu kernel refuses the events to every process
      # without privileges.
      - name: Suite of a kernel that refuses
        if: env.COUNTS == 'true'
        run: |
          sudo sysctl -w kernel.perf_event_paranoid=4
          make installcheck-paranoid EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster-paranoid"
          sudo sysctl -w kernel.perf_event_paranoid=2
      - name: Suite of workers that cannot count
        if: env.COUNTS == 'true'
        run: |
          make PG_PMU_TEST=workers-cannot-count COPT=-Werror
          make PG_PMU_TEST=workers-cannot-count install
          make installcheck-workers-cannot-count EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster-workers"
      # Where the runner counts, the build without counters is the only
      # one that shows the second expected outputs.
      - name: Suites of the build without counters
        run: |
          make PG_PMU_COUNTERS=none COPT=-Werror
          make PG_PMU_COUNTERS=none install
          make PG_PMU_COUNTERS=none installcheck EXTRA_REGRESS_OPTS="--temp-instance=$RUNNER_TEMP/cluster-none"
      - name: Expected outputs of the build without counters
        run: .github/scripts/expected-outputs.sh counters_1.out
      - name: Differences and the server's log
        if: failure()
        run: |
          cat regression.diffs output_unloaded/regression.diffs 2>/dev/null || true
          grep -n -A30 -E 'TRAP:|terminated by signal' log/postmaster.log 2>/dev/null | head -300 || true
          tail -n 50 log/postmaster.log 2>/dev/null || true

  loom:
    name: Models of loom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/pg_pmu_core -> target
          key: loom
      - name: Models of loom
        working-directory: crates/pg_pmu_core
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test --release --test loom

  kani:
    name: Proofs of Kani
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1
        with:
          kani-version: '0.68.0'
          working-directory: crates/pg_pmu_core
