schema: spec-driven

# Shown to an agent with the instructions of every artifact.
context: |
  pg_pmu is a PostgreSQL extension in C, built with PGXS, with the
  cells of its shared memory in a Rust crate, checked with loom,
  proptest and Kani. It adds an
  option to EXPLAIN ANALYZE that shows how many instructions and
  cycles of the processor one statement took. It supports PostgreSQL
  19 and master, on Linux and macOS. Its first use is to compare two
  executors of the same query, such as PostgreSQL's own and Tessera's.

  A capability is one part of the extension and one folder,
  openspec/specs/<name>/. spec.md says what the part promises.
  design.md says how it is built and why; OpenSpec does not read it,
  people and agents keep it by hand. Where the two disagree, spec.md
  is right.

  A spec names what a user can see only: the EXPLAIN option and its
  output in every format, the settings, the errors and their SQLSTATE,
  what the extension needs from the system (privileges, kernel
  settings), and the layout of its shared memory. Internal names and
  steps belong in design.md.

  A spec and a design are written for a reader who knows nothing about
  the part, in simple English: short sentences, common words, one
  thought in a sentence. Every term is explained where it first
  appears. A design goes from the whole to the details: what the part
  is for and the problem it solves; the goals and what each choice
  costs; the design as a whole, with a picture; then each piece, with
  the alternatives refused; Files and Tests last. The spec and the
  design of a capability are self-contained: no reference to a change
  or a pull request, and no dates. The design of an open change may
  point to its own proposal and spec, and records the decisions of the
  maintainer with their dates.

  Everything in the repository is written in English. Markdown is
  wrapped at 72 columns and never runs past 80.

rules:
  proposal:
    - >-
      Say in "Why" what cannot be done today, with the case that shows
      it.
  specs:
    - >-
      One topic in a requirement, one to five scenarios for it, at most
      ten requirements in a change.
    - >-
      End every scenario with one bullet
      "- **Verified by:** `<path>::<text>`", where the path is a file in
      the repository and the text occurs in that file: the name of a
      test, or a mark "-- spec: <capability>/<scenario>" in an SQL
      suite. "- **Verified by:** review only — <reason>" when no test
      can show it, "- **Verified by:** pending" only while the change
      is open.
    - Leave out measurements and names of internal functions.
  design:
    - >-
      Write "What we do not do" with the reasons.
    - Record each decision of the maintainer with its date.
  tasks:
    - >-
      A task is one commit that builds and passes the checks by itself;
      name the command that checks it.
